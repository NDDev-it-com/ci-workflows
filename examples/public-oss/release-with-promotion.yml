# NDDev exact-SHA promotion followed by immutable SBOM + attestations release.
# Replace both @<sha> values with the same pinned ci-workflows commit.
name: release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promotion:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-promotion-gate.yml@<sha>
    with:
      version: ${{ github.ref_name }}
      control_plane_repository: NDDev-it-com/nddev-harnesses
  publish:
    needs: promotion
    permissions: { contents: write, id-token: write, attestations: write, artifact-metadata: write }
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-supply-chain.yml@<sha>
    with:
      version: ${{ github.ref_name }}
      package_name: my-repo
      archive_paths: "README.md LICENSE VERSION CHANGELOG.md src"
