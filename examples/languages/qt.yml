# Qt (C++) CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
# NOTE: `jurplel/install-qt-action` resolves nested actions by tag inside its
# own definition, so this workflow is refused during `Set up job` in a
# repository that *enforces* "require actions to be pinned to a full-length
# commit SHA". Pinning the line below does not help — GitHub resolves the whole
# nested graph before any step runs. See ci-workflows issue #150.
name: qt
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qt:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/qt-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      # Use an exact Qt release for reproducible provisioning.
      qt_version: '6.8.3'
