# Dart/Flutter CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: dart-flutter
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: dart-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dart-flutter:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/dart-flutter-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      flutter_channel: stable
      # Exact versions make SDK provenance and cache identity reproducible.
      # Resolve, format, analyze and test use the reusable defaults.
      flutter_version: '3.47.0'
