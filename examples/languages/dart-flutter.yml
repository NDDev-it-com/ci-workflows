# Dart/Flutter CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
# NOTE: `subosito/flutter-action` resolves nested actions by tag inside its
# own definition, so this workflow is refused during `Set up job` in a
# repository that *enforces* "require actions to be pinned to a full-length
# commit SHA". Pinning the line below does not help — GitHub resolves the whole
# nested graph before any step runs. See ci-workflows issue #150.
name: dart-flutter
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: dart-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dart-flutter:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/dart-flutter-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      flutter_channel: stable
      # Pin an exact release for reproducible evidence; omit to follow stable.
      flutter_version: '3.47.0'
