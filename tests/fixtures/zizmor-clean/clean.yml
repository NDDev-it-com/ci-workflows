name: clean fixture
# The accepting half of the zizmor pair. Same shape as the injection fixture
# next door — an untrusted value reaching a shell command — but done the way
# CONTRIBUTING requires: through `env:`, referenced as a shell variable.
#
# The trigger is `push`, not `pull_request_target`. The first version of this
# file kept the dangerous trigger for symmetry and zizmor rejected it too, on
# `dangerous-triggers` — which is the scanner being right and the fixture being
# wrong. An accepting case has to actually be accepted or it proves nothing.
on:
  push:
    branches: ['fixtures/**']

permissions: {}

jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Pass an untrusted value through env
        env:
          TITLE: ${{ github.event.head_commit.message }}
        run: echo "message is $TITLE"
