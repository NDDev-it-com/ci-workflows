name: qt-ci

# Reusable Qt (C++) CI for BOTH tiers: pinned install-qt-action
# (aqtinstall) with cache, optional ccache, and caller-provided
# configure/build/test commands passed via env. Defaults target a CMake project.

on:
  workflow_call:
    outputs:
      evidence:
        description: 'Redacted JSON receipt for the Qt/CMake toolchain and successful default lanes.'
        value: ${{ jobs.qt.outputs.evidence }}
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      qt_version:
        description: 'Qt version spec for aqtinstall, e.g. 6.8.* or 6.8.3.'
        type: string
        default: '6.8.*'
      qt_host:
        description: 'aqtinstall host (linux, mac, windows). Empty auto-detects from the runner.'
        type: string
        default: ''
      qt_target:
        description: 'aqtinstall target: desktop, android, or ios.'
        type: string
        default: 'desktop'
      qt_arch:
        description: 'aqtinstall arch (empty picks the host default).'
        type: string
        default: ''
      qt_modules:
        description: 'Space-separated extra Qt modules, e.g. "qtcharts qtmultimedia".'
        type: string
        default: ''
      working_directory:
        type: string
        default: '.'
      enable_ccache:
        type: boolean
        default: false
      ccache_key:
        type: string
        default: 'qt-ci'
      configure_command:
        description: 'Configure command (bash). Empty to skip.'
        type: string
        default: 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release'
      build_command:
        description: 'Build command (bash). Empty to skip.'
        type: string
        default: 'cmake --build build --parallel'
      test_command:
        description: 'Test command (bash). Empty to skip.'
        type: string
        default: 'ctest --test-dir build --output-on-failure'
      timeout_minutes:
        type: number
        default: 40

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  qt:
    name: qt (${{ inputs.qt_version }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      evidence: ${{ steps.evidence.outputs.evidence }}
    defaults:
      run:
        # Explicit, and not redundant with the workflow-level default above:
        # a job-level `defaults.run` replaces the workflow-level one rather than
        # merging with it, so declaring working-directory here silently drops the
        # shell. On Linux nothing changes because bash is the default anyway; on
        # Windows every run step becomes PowerShell and bash syntax stops working.
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730  # v4.3.1
        with:
          version: ${{ inputs.qt_version }}
          host: ${{ inputs.qt_host }}
          target: ${{ inputs.qt_target }}
          arch: ${{ inputs.qt_arch }}
          modules: ${{ inputs.qt_modules }}
          cache: true
          cache-key-prefix: qt-ci-v1
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'

      - name: Set up ccache
        if: ${{ inputs.enable_ccache }}
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{ inputs.ccache_key }}

      - name: Configure
        if: ${{ inputs.configure_command != '' }}
        env:
          CONFIGURE_COMMAND: ${{ inputs.configure_command }}
        run: bash -euo pipefail -c "$CONFIGURE_COMMAND"

      - name: Build
        if: ${{ inputs.build_command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Test
        if: ${{ inputs.test_command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_LOG: ${{ runner.temp }}/qt-tests.log
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee "$TEST_LOG"

      - name: Emit runtime evidence
        id: evidence
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          CONFIGURE_COMMAND: ${{ inputs.configure_command }}
          QT_VERSION_INPUT: ${{ inputs.qt_version }}
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_LOG: ${{ runner.temp }}/qt-tests.log
          WORKFLOW_FILE: ${{ github.workspace }}/.github/workflows/qt-ci.yml
        run: |
          python3 -I <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          log = pathlib.Path(os.environ["TEST_LOG"])
          text = log.read_text(encoding="utf-8")
          total = re.search(r"tests failed out of (\d+)", text)
          receipt = {
              "aqt_version": subprocess.check_output(["aqt", "version"], text=True).strip(),
              "build_command": os.environ["BUILD_COMMAND"],
              "cache_key_prefix": "qt-ci-v1",
              "caller_sha": os.environ["GITHUB_SHA"],
              "cmake_version": subprocess.check_output(["cmake", "--version"], text=True).splitlines()[0],
              "configure_command": os.environ["CONFIGURE_COMMAND"],
              "os": os.environ["RUNNER_OS"],
              "qt_version": subprocess.check_output(["qmake", "-query", "QT_VERSION"], text=True).strip(),
              "qt_version_input": os.environ["QT_VERSION_INPUT"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "test_command": os.environ["TEST_COMMAND"],
              "test_count": int(total.group(1)) if "100% tests passed" in text and total else 0,
              "test_log_sha256": hashlib.sha256(log.read_bytes()).hexdigest(),
              "workflow_sha256": hashlib.sha256(pathlib.Path(os.environ["WORKFLOW_FILE"]).read_bytes()).hexdigest(),
          }
          if receipt["test_count"] < 1:
              raise SystemExit("CTest produced no successful tests")
          encoded = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"evidence={encoded}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\nRuntime evidence: `{encoded}`\n")
          PY

      - name: Summary
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: echo "Qt ${QT_VERSION} configure + build + test passed." >> "$GITHUB_STEP_SUMMARY"
