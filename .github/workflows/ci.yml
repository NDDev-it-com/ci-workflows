name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ci-gate is this repository's required context. A required check is never
  # reported to a merge queue unless its workflow subscribes to merge_group,
  # so without this an enabled queue would wait forever for a status that can
  # never arrive.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR iterations, but never a queued merge-group candidate
  # or a main push: cancelling those makes branch protection observe a
  # partial-cancel status instead of a decisive result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Blocking tier. Every check here is a property of the tree in hand, so it can
  # only fail because of the change. Calendar-driven external facts are NOT here
  # — see maintenance.yml. One required job used to mix the two, which made a
  # third party's pricing page going stale enough to block an unrelated bugfix.
  validate:
    name: static validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.11.30
      - name: Install validator dependencies
        run: uv pip install --system --require-hashes -r requirements-ci.txt
      - name: Run static validators
        run: python3 scripts/validate_all.py --tier core

  # Blocking, but scoped: a product fact is checked for expiry only when the
  # changed capability declares it, and a runtime-coverage waiver only when its
  # workflow was touched. Needs full history to resolve a merge base.
  validate-touched:
    name: changed-path validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            agent.api.stepsecurity.io:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.11.30
      - name: Install validator dependencies
        run: uv pip install --system --require-hashes -r requirements-ci.txt
      - name: Resolve the change base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group)  base="$MERGE_GROUP_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            base="" ;;
          esac
          # An all-zero oid means "no previous tip" (branch creation or a
          # force-push beyond reachable history). Go conservative and scope to
          # the whole tree rather than silently scoping to nothing.
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="" ;;
          esac
          printf 'ref=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Run changed-path validators
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ]; then
            echo "no resolvable base; running the full sweep instead of scoping to nothing"
            python3 scripts/validate_all.py --tier scheduled
          else
            python3 scripts/validate_all.py --tier touched --changed-from "$BASE_REF"
          fi

  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/actionlint.yml
    with:
      runner: ubuntu-latest

  zizmor:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/zizmor-sarif.yml
    with:
      runner: ubuntu-latest

  ci-gate:
    name: ci-gate
    needs: [validate, validate-touched, actionlint, zizmor]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Caller-native: `needs` is this run's real dependency graph, so nothing
      # crosses a workflow boundary and nothing can be substituted. This is the
      # shape a required check must have — see docs/08 and gate.yml's header.
      - name: Aggregate required results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          if not results:
              print("ci-gate: needs context is empty", file=sys.stderr)
              raise SystemExit(1)
          failures = [
              f"  {job}: {(entry or {}).get('result', 'unknown')}"
              for job, entry in sorted(results.items())
              if (entry or {}).get("result") != "success"
          ]
          if failures:
              print("ci-gate FAILED:", file=sys.stderr)
              for line in failures:
                  print(line, file=sys.stderr)
              raise SystemExit(1)
          print(f"ci-gate passed ({len(results)} jobs)")
          PY
