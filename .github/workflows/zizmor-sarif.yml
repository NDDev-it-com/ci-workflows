name: zizmor-sarif

# Reusable zizmor GitHub Actions security static analysis WITH SARIF upload.
# Use on PUBLIC repos (code scanning is free) or private repos WITH GitHub Code
# Security. The caller job must grant `security-events: write`. For private-free
# repos, use zizmor-no-sarif.yml instead (contents: read only).
#
# zizmor catches Actions anti-patterns actionlint/CodeQL miss: template
# injection, credential persistence/leakage, excessive permissions, impostor
# commits, and confusable refs.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'amsterdam'
      zizmor_version:
        type: string
        default: '1.26.1'
      persona:
        description: 'zizmor persona: regular, pedantic, or auditor.'
        type: string
        default: 'regular'
      min_severity:
        description: 'Minimum finding severity to report: unknown, informational, low, medium, high.'
        type: string
        default: 'low'
      target:
        description: 'Path zizmor analyzes.'
        type: string
        default: '.'

permissions: {}

jobs:
  zizmor:
    name: zizmor (SARIF)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      # Read repository contents and publish zizmor SARIF to code scanning.
      # actions: read is required by github/codeql-action/upload-sarif, which
      # reads the workflow run; without it the upload fails on private repos.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.11.30

      - name: Run zizmor (SARIF)
        id: scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_VERSION: ${{ inputs.zizmor_version }}
          ZIZMOR_PERSONA: ${{ inputs.persona }}
          ZIZMOR_MIN_SEVERITY: ${{ inputs.min_severity }}
          ZIZMOR_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          uvx "zizmor@${ZIZMOR_VERSION}" \
            --persona "${ZIZMOR_PERSONA}" \
            --min-severity "${ZIZMOR_MIN_SEVERITY}" \
            --format sarif \
            "${ZIZMOR_TARGET}" > zizmor.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Enforce zizmor result
        if: ${{ steps.scan.outcome == 'failure' }}
        env:
          ZIZMOR_MIN_SEVERITY: ${{ inputs.min_severity }}
        run: |
          echo "zizmor reported findings at or above severity '${ZIZMOR_MIN_SEVERITY}'." >&2
          exit 1
