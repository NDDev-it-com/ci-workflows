name: runtime-negative

# Proves the gates can FAIL — and stays green doing it.
#
# The rest of the estate proves a reusable starts and passes on good input.
# That is half a proof: a gate that never fails is not a gate.
#
# The obvious way to prove the other half is to call the reusable with a broken
# fixture and expect the job to fail. That is not available: `continue-on-error`
# is rejected on a job that calls a reusable with `uses:`, so every expected
# failure turns the whole run red, and a permanently red workflow is
# indistinguishable from a broken one at a glance. An earlier version of this
# file did exactly that and was replaced for precisely that reason.
#
# Instead each gate's real step is lifted out of its workflow and executed here,
# in an ordinary job where an exit code is just data. scripts/negative_gate_probe.py
# reads the step's own `run:` text and `env:` block from the workflow file — it
# paraphrases nothing, so an edit to the step is an edit to what runs here, and
# a rename fails loudly instead of silently testing nothing.
#
# Every probe runs BOTH directions: the broken fixture must be rejected and the
# clean one accepted. The second half is not ceremony. The first local run of
# the probe reported "gate refused as required" when the real reason was
# `terraform: command not found`; without the accepting case, a missing
# toolchain looks exactly like a working gate.
#
# docs-quality has no lane here: all three of its gates are `uses:` steps, and
# an action cannot be lifted out of its runner.

on:
  pull_request:
  push:
    branches: ['fixtures/**']
  schedule:
    # Sundays 06:00 UTC, after the fixture estate.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: runtime-negative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-gates:
    name: gates refuse bad input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.24'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.11.30
          python-version: '3.13'
          activate-environment: true
          enable-cache: false

      - name: Install the probe's dependency and both Python fixtures
        run: |
          set -euo pipefail
          # The probe reads workflow YAML through the repository's strict
          # loader, so it needs PyYAML — from the hash-locked file CI already
          # uses, not an ad-hoc install.
          uv pip install --require-hashes -r requirements-ci.txt
          # Both fixture packages must be importable in one environment: the
          # probe runs the same step twice and only the directory changes.
          uv pip install -e tests/fixtures/python -e tests/fixtures/negative/python pytest

      - name: terraform-ci must reject unformatted HCL
        run: |
          python3 -I scripts/negative_gate_probe.py \
            --workflow .github/workflows/terraform-ci.yml --job terraform \
            --step 'Format check' \
            --bad tests/fixtures/negative/terraform --good tests/fixtures/terraform

      - name: go-ci must report a failing test
        run: |
          python3 -I scripts/negative_gate_probe.py \
            --workflow .github/workflows/go-ci.yml --job go \
            --step 'Run tests' \
            --bad tests/fixtures/negative/go --good tests/fixtures/go

      - name: sql-ci must reject SQL the dialect refuses
        run: |
          python3 -I scripts/negative_gate_probe.py \
            --workflow .github/workflows/sql-ci.yml --job sql \
            --step 'Lint' \
            --bad tests/fixtures/negative/sql --good tests/fixtures/sql

      - name: python-ci must report a failing test
        run: |
          python3 -I scripts/negative_gate_probe.py \
            --workflow .github/workflows/python-ci.yml --job python \
            --step 'Run tests' \
            --bad tests/fixtures/negative/python --good tests/fixtures/python \
            --input test_command='python -m pytest -q'

  dockerfile-gate:
    name: hadolint refuses an unpinned image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.11.30
          python-version: '3.13'
          activate-environment: true
          enable-cache: false

      - name: Install the probe's dependency
        run: |
          set -euo pipefail
          uv pip install --require-hashes -r requirements-ci.txt

      # hadolint varies by input rather than by directory, and its binary is
      # installed by an earlier step of the workflow itself, so --before runs
      # that download instead of assuming a hadolint is already present.
      - name: hadolint-ci must reject an unpinned base and package
        run: |
          python3 -I scripts/negative_gate_probe.py \
            --workflow .github/workflows/hadolint-ci.yml --job hadolint \
            --before 'Download hadolint (pinned + checksum-verified)' \
            --step 'Run hadolint' \
            --bad . --good . \
            --bad-input dockerfile=tests/fixtures/negative/docker/Dockerfile \
            --good-input dockerfile=tests/fixtures/docker/Dockerfile
