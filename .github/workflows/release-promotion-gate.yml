name: release-promotion-gate

# Verify that a numeric release tag carries a signed, exact-SHA promotion
# decision from the private NDDev control plane. This workflow is intentionally
# read-only: publication remains in release-supply-chain.yml and callers must
# make that job depend on this gate.

on:
  workflow_call:
    inputs:
      version:
        description: 'Numeric SemVer X.Y.Z; must equal the triggering tag.'
        type: string
        required: true
      control_plane_repository:
        description: 'Private control-plane repository named by the promotion record.'
        type: string
        default: 'NDDev-it-com/nddev-harnesses'
      runner:
        description: 'Trusted Linux runner label used for the read-only verification job.'
        type: string
        default: 'amsterdam'

permissions: {}

jobs:
  promotion:
    name: Verify exact release promotion
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CONTROL_PLANE_REPOSITORY: ${{ inputs.control_plane_repository }}
      GH_TOKEN: ${{ github.token }}
      PUBLIC_REPOSITORY: ${{ github.repository }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Fetch annotated release tag
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "promotion gate: version must be numeric SemVer X.Y.Z" >&2
            exit 1
          fi
          if [ "$RELEASE_REF_TYPE" != "tag" ] || [ "$RELEASE_REF_NAME" != "$RELEASE_VERSION" ]; then
            echo "promotion gate: version must equal the triggering tag" >&2
            exit 1
          fi
          promotion_dir="$(mktemp -d "${RUNNER_TEMP}/release-promotion.XXXXXX")"
          chmod 700 "$promotion_dir"
          ref_json="$promotion_dir/ref.json"
          tag_json="$promotion_dir/tag.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${PUBLIC_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" >"$ref_json"
          tag_object_sha="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$ref_json")"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${PUBLIC_REPOSITORY}/git/tags/${tag_object_sha}" >"$tag_json"
          {
            printf 'PROMOTION_REF_JSON=%s\n' "$ref_json"
            printf 'PROMOTION_TAG_JSON=%s\n' "$tag_json"
          } >>"$GITHUB_ENV"

      - name: Verify signed promotion record
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys

          SCHEMA = "nddev-release-promotion/v1"
          MAX_AGE = dt.timedelta(hours=168)
          CLOCK_SKEW = dt.timedelta(minutes=5)
          REQUIRED_ROLES = {
              "current-install",
              "current-lifecycle",
              "module-release",
              "platform-macos-arm64",
              "platform-macos-x64",
              "platform-ubuntu",
              "root-actionlint",
              "root-secret-scan",
              "root-zizmor",
          }
          SHA = re.compile(r"[0-9a-f]{40}")
          DIGEST = re.compile(r"sha256:[0-9a-f]{64}")
          REPOSITORY = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")

          def fail(message):
              print(f"promotion gate: {message}", file=sys.stderr)
              raise SystemExit(1)

          def read_json(path_name):
              try:
                  path = pathlib.Path(os.environ[path_name])
                  if path.is_symlink() or not path.is_file():
                      fail(f"{path_name} must name a regular non-symlink file")
                  return json.loads(path.read_text(encoding="utf-8"))
              except (KeyError, OSError, UnicodeError, json.JSONDecodeError) as exc:
                  fail(f"cannot read {path_name}: {exc}")

          def exact_keys(value, expected, label):
              if not isinstance(value, dict) or set(value) != expected:
                  fail(f"{label} must contain exactly {sorted(expected)}")

          def timestamp(value, label):
              if not isinstance(value, str) or not value.endswith("Z"):
                  fail(f"{label} must be an RFC3339 UTC timestamp")
              try:
                  parsed = dt.datetime.fromisoformat(value[:-1] + "+00:00")
              except ValueError as exc:
                  fail(f"{label} is invalid: {exc}")
              if parsed.tzinfo != dt.timezone.utc:
                  fail(f"{label} must use UTC")
              return parsed

          ref = read_json("PROMOTION_REF_JSON")
          tag = read_json("PROMOTION_TAG_JSON")
          exact_keys(ref, {"ref", "node_id", "url", "object"}, "tag reference")
          exact_keys(ref["object"], {"sha", "type", "url"}, "tag reference object")
          if ref["ref"] != f"refs/tags/{os.environ['RELEASE_VERSION']}":
              fail("API tag reference does not equal the requested numeric tag")
          if ref["object"]["type"] != "tag" or not SHA.fullmatch(ref["object"]["sha"]):
              fail("release ref must point directly to an annotated tag object")

          required_tag_keys = {
              "node_id", "sha", "url", "tagger", "object", "tag", "message", "verification"
          }
          exact_keys(tag, required_tag_keys, "annotated tag")
          if tag["sha"] != ref["object"]["sha"]:
              fail("annotated tag object does not match the fetched reference")
          if tag["tag"] != os.environ["RELEASE_VERSION"]:
              fail("annotated tag name does not equal the requested version")
          exact_keys(tag["object"], {"sha", "type", "url"}, "annotated tag target")
          public_sha = tag["object"]["sha"]
          if tag["object"]["type"] != "commit" or not SHA.fullmatch(public_sha):
              fail("annotated release tag must point directly to one commit")
          verification = tag["verification"]
          if not isinstance(verification, dict):
              fail("annotated tag has no GitHub verification result")
          if verification.get("verified") is not True or verification.get("reason") != "valid":
              fail("annotated tag signature is not GitHub-verified and valid")

          payload = verification.get("payload")
          if not isinstance(payload, str):
              fail("GitHub verification did not return the signed tag payload")
          try:
              signed_headers, signed_body = payload.split("\n\n", 1)
          except ValueError:
              fail("signed tag payload has no annotation boundary")
          header_lines = signed_headers.splitlines()
          if len(header_lines) != 4:
              fail("signed tag payload must contain exactly four tag-object headers")
          if header_lines[:3] != [
              f"object {public_sha}",
              "type commit",
              f"tag {os.environ['RELEASE_VERSION']}",
          ]:
              fail("signed tag payload headers do not match the API tag target")
          if not header_lines[3].startswith("tagger ") or " <" not in header_lines[3]:
              fail("signed tag payload has a malformed tagger header")
          if not signed_body.endswith("\n"):
              fail("signed promotion annotation must end in exactly one LF")
          record_text = signed_body[:-1]
          try:
              record = json.loads(record_text)
          except json.JSONDecodeError as exc:
              fail(f"signed promotion annotation is not JSON: {exc}")
          canonical = json.dumps(record, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
          if signed_body != canonical + "\n":
              fail("promotion record must be canonical compact sorted-key JSON plus one LF")
          exact_keys(
              record,
              {
                  "control_plane", "evidence", "expires_at", "generated_at",
                  "public_commit", "public_repository", "schema", "version",
              },
              "promotion record",
          )
          if record["schema"] != SCHEMA:
              fail("unsupported promotion-record schema")
          if record["public_repository"] != os.environ["PUBLIC_REPOSITORY"]:
              fail("promotion record names a different public repository")
          if record["public_commit"] != public_sha:
              fail("promotion record public commit does not equal the tag target")
          if record["version"] != os.environ["RELEASE_VERSION"]:
              fail("promotion record version does not equal the tag")

          control = record["control_plane"]
          exact_keys(control, {"commit", "registry_digest", "repository"}, "control_plane")
          if control["repository"] != os.environ["CONTROL_PLANE_REPOSITORY"]:
              fail("promotion record names an unexpected control-plane repository")
          if REPOSITORY.fullmatch(control["repository"]) is None:
              fail("control-plane repository is malformed")
          if SHA.fullmatch(control["commit"]) is None:
              fail("control-plane commit is malformed")
          if DIGEST.fullmatch(control["registry_digest"]) is None:
              fail("control-plane registry digest is malformed")

          now_text = os.environ.get("PROMOTION_NOW")
          now = timestamp(now_text, "PROMOTION_NOW") if now_text else dt.datetime.now(dt.timezone.utc)
          generated = timestamp(record["generated_at"], "generated_at")
          expires = timestamp(record["expires_at"], "expires_at")
          if generated > now + CLOCK_SKEW:
              fail("promotion record was generated in the future")
          if expires <= now:
              fail("promotion record has expired")
          if expires <= generated or expires - generated > MAX_AGE:
              fail("promotion validity window must be positive and at most 168 hours")

          evidence = record["evidence"]
          if not isinstance(evidence, list):
              fail("evidence must be a list")
          roles = [item.get("role") if isinstance(item, dict) else None for item in evidence]
          if len(roles) != len(set(roles)) or set(roles) != REQUIRED_ROLES:
              fail(f"evidence roles must equal exactly {sorted(REQUIRED_ROLES)}")
          if roles != sorted(roles):
              fail("evidence records must be sorted by role")

          evidence_keys = {
              "architecture", "digest", "kind", "limitations", "observed_at",
              "public_commit", "result", "role", "root_commit", "source",
          }
          for item in evidence:
              exact_keys(item, evidence_keys, f"evidence {item.get('role')!r}")
              role = item["role"]
              if item["result"] != "success":
                  fail(f"evidence {role} did not succeed")
              if item["root_commit"] != control["commit"]:
                  fail(f"evidence {role} names a different root commit")
              if item["public_commit"] != public_sha:
                  fail(f"evidence {role} names a different public commit")
              if DIGEST.fullmatch(item["digest"]) is None:
                  fail(f"evidence {role} digest is malformed")
              if not isinstance(item["source"], str) or not item["source"].strip():
                  fail(f"evidence {role} source must be non-empty")
              observed = timestamp(item["observed_at"], f"evidence {role} observed_at")
              if observed > generated + CLOCK_SKEW or generated - observed > MAX_AGE:
                  fail(f"evidence {role} is outside the accepted freshness window")

              expected_arch = None
              if role == "platform-macos-arm64":
                  expected_arch = "arm64"
              elif role == "platform-macos-x64":
                  expected_arch = "x64"
              if item["architecture"] != expected_arch:
                  fail(f"evidence {role} has the wrong architecture marker")

              if item["kind"] == "executed":
                  if item["limitations"] is not None:
                      fail(f"executed evidence {role} must not declare limitations")
              elif item["kind"] == "artifact-validation-substitute":
                  if role != "platform-macos-x64":
                      fail("only macOS x64 may use an artifact-validation substitute")
                  if not isinstance(item["limitations"], str) or not item["limitations"].strip():
                      fail("artifact-validation substitute must state residual limitations")
              else:
                  fail(f"evidence {role} has an unsupported kind")

          record_digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          print(
              f"promotion gate: verified {record['public_repository']}@{public_sha} "
              f"for {record['version']} via {control['repository']}@{control['commit']} "
              f"record={record_digest}"
          )
          PY
