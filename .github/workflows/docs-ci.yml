name: docs-ci

# Reusable docs CI for BOTH tiers. Dependency-free: checks Markdown for broken
# relative links (a common docs rot) and runs an optional caller command for
# heavier linting. No third-party linter is pulled in by default.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      exclude_glob:
        description: >-
          Glob of Markdown files to skip, or empty to skip none. A repository
          that keeps deliberately broken fixtures — to prove its own link
          checker still fails — cannot use the repo-wide default without the
          fixtures failing the very lane they exist to test. This is that
          escape hatch, and it is narrow on purpose: one glob, no regex, no
          ignore file.
        type: string
        default: ''
      docs_glob:
        description: 'Glob of Markdown files to check.'
        type: string
        default: '**/*.md'
      command:
        description: 'Optional extra docs command (bash). Runs after link check.'
        type: string
        default: ''

permissions: {}

jobs:
  docs:
    name: docs link check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check relative Markdown links
        env:
          DOCS_GLOB: ${{ inputs.docs_glob }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, glob
          from pathlib import Path
          pattern = os.environ["DOCS_GLOB"]
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          broken = []
          for md in glob.glob(pattern, recursive=True):
              base = Path(md).parent
              text = Path(md).read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  t = target.strip()
                  if t.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  t = t.split("#", 1)[0].split("?", 1)[0]
                  if not t:
                      continue
                  if not (base / t).exists():
                      broken.append(f"{md}: broken relative link -> {target}")
          if broken:
              print("Broken relative links:")
              for b in broken:
                  print(f"  - {b}")
              sys.exit(1)
          print("All relative Markdown links resolve.")
          PY

      - name: Run extra docs command
        if: ${{ inputs.command != '' }}
        env:
          DOCS_COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$DOCS_COMMAND"
