# Canonical public default-branch consumer for Scorecard SARIF evidence.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 2 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      security-events: write # upload the Scorecard SARIF to Code Scanning
      contents: read # read the public repository Scorecard evaluates
      actions: read # inspect workflow definitions for the scoring checks
      # Deliberately no id-token: publish_results is false because OpenSSF's
      # publishing verifier does not accept reusable-workflow caller shape.
    uses: ./.github/workflows/public-scorecard.yml
    with:
      runner: ubuntu-latest
      publish_results: false
      sarif_category: ossf-scorecard
