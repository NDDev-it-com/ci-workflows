name: kotlin-android-ci

# Reusable Kotlin/Android CI for BOTH tiers: pinned setup-java +
# setup-gradle (with Gradle cache), optional Android SDK, and caller-provided
# lint/build commands passed via env. Works for pure-JVM Kotlin and Android.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'amsterdam'
      java_version:
        type: string
        default: '21'
      java_distribution:
        type: string
        default: 'temurin'
      working_directory:
        type: string
        default: '.'
      setup_android:
        description: 'Install the Android SDK command-line tools (needed for Android modules).'
        type: boolean
        default: false
      android_packages:
        description: 'Extra sdkmanager packages (space-separated). Empty installs the defaults.'
        type: string
        default: ''
      lint_command:
        description: 'Lint command (bash), e.g. "./gradlew ktlintCheck detekt". Empty to skip.'
        type: string
        default: ''
      build_command:
        description: 'Build/test command (bash).'
        type: string
        default: './gradlew build'
      timeout_minutes:
        type: number
        default: 30

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  kotlin-android:
    name: kotlin-android (java ${{ inputs.java_version }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

      - name: Set up Android SDK
        if: ${{ inputs.setup_android }}
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ${{ inputs.android_packages }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        env:
          LINT_COMMAND: ${{ inputs.lint_command }}
        run: bash -euo pipefail -c "$LINT_COMMAND"

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          JAVA_VER: ${{ inputs.java_version }}
        run: |
          bash -euo pipefail -c "$BUILD_COMMAND"
          echo "Kotlin/Android (JDK ${JAVA_VER}) build passed." >> "$GITHUB_STEP_SUMMARY"
