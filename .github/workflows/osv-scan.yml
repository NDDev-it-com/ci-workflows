name: osv-scan

# Reusable OSV-Scanner SCA for BOTH tiers. Free on private-free repos, where
# GitHub dependency review is a paid GHAS feature. Pinned, checksum-verified
# binary; gate-only: known vulnerabilities fail the job (no SARIF upload).

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      working_directory:
        type: string
        default: '.'
      scan_args:
        description: 'Arguments after "osv-scanner scan source", e.g. "--recursive ." or "--lockfile=path".'
        type: string
        default: '--recursive .'
      osv_scanner_version:
        type: string
        default: '2.4.0'
      osv_scanner_sha256:
        description: 'SHA256 of osv-scanner_linux_amd64 from the release SHA256SUMS.'
        type: string
        default: '15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0'
      timeout_minutes:
        type: number
        default: 15

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  osv-scan:
    name: osv-scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner (pinned + checksum-verified)
        env:
          OSV_VERSION: ${{ inputs.osv_scanner_version }}
          OSV_SHA256: ${{ inputs.osv_scanner_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          # Install into a runner-writable directory rather than /usr/local/bin:
          # GitHub-hosted runners let the job user write there, self-hosted ones
          # normally do not, and a correctly isolated self-hosted runner must not.
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 /tmp/osv-scanner "${RUNNER_TEMP}/bin/osv-scanner"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/osv-scanner" --version

      - name: OSV scan
        env:
          OSV_SCAN_ARGS: ${{ inputs.scan_args }}
        run: |
          # shellcheck disable=SC2086
          osv-scanner scan source $OSV_SCAN_ARGS
          echo "OSV-Scanner SCA passed." >> "$GITHUB_STEP_SUMMARY"
