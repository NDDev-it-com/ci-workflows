name: dart-flutter-ci

# Reusable Dart/Flutter CI for BOTH tiers: the SDK is provisioned from Google's
# published release manifest and verified against the SHA-256 that manifest
# publishes, with format + analyze gates and a caller-provided test command
# passed via env (no `${{ inputs.* }}` inline in run:).
#
# The SDK is installed here rather than by `subosito/flutter-action` because that
# action names `actions/cache` by tag inside its own definition, and GitHub
# resolves the whole nested action graph at job setup. Any repository enforcing
# "require actions to be pinned to a full-length commit SHA" -- the control this
# library recommends to its own consumers -- therefore could not start this
# workflow at all. Every action reachable from here is pinned by us.

on:
  workflow_call:
    outputs:
      evidence:
        description: 'Redacted JSON receipt for the resolved SDK and successful default lanes.'
        value: ${{ jobs.dart-flutter.outputs.evidence }}
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      flutter_channel:
        description: 'flutter-action channel: stable, beta, or master.'
        type: string
        default: 'stable'
      flutter_version:
        description: 'Exact Flutter version (e.g. 3.35.0) or empty for the channel default.'
        type: string
        default: ''
      working_directory:
        type: string
        default: '.'
      pub_get_command:
        description: 'Dependency resolution command (bash). Empty to skip.'
        type: string
        default: 'flutter pub get'
      format_check:
        description: 'Run dart format --set-exit-if-changed.'
        type: boolean
        default: true
      analyze:
        description: 'Run flutter analyze.'
        type: boolean
        default: true
      test_command:
        description: 'Test/verify command (bash).'
        type: string
        default: 'flutter test'
      timeout_minutes:
        type: number
        default: 20

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  dart-flutter:
    name: dart-flutter (${{ inputs.flutter_channel }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      evidence: ${{ steps.evidence.outputs.evidence }}
    defaults:
      run:
        # Explicit, and not redundant with the workflow-level default above:
        # a job-level `defaults.run` replaces the workflow-level one rather than
        # merging with it, so declaring working-directory here silently drops the
        # shell. On Linux nothing changes because bash is the default anyway; on
        # Windows every run step becomes PowerShell and bash syntax stops working.
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Flutter release
        id: release
        working-directory: ${{ github.workspace }}
        env:
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
        run: |
          python3 -I <<'PY'
          import json, os, platform, urllib.request

          # Google publishes one manifest per host, each listing every release
          # with the archive path and its SHA-256. Resolution happens before
          # anything is downloaded, so the digest is known in advance rather
          # than computed from whatever arrived.
          HOSTS = {"Linux": "linux", "macOS": "macos", "Windows": "windows"}
          host = HOSTS[os.environ["RUNNER_OS"]]
          url = ("https://storage.googleapis.com/flutter_infra_release/releases/"
                 f"releases_{host}.json")
          with urllib.request.urlopen(url, timeout=60) as response:
              manifest = json.loads(response.read().decode("utf-8"))

          channel = os.environ["FLUTTER_CHANNEL"]
          wanted = os.environ["FLUTTER_VERSION"].strip()
          if channel not in manifest["current_release"]:
              raise SystemExit(f"unknown Flutter channel {channel!r}")

          # macOS ships separate arm64 and x64 archives; the other hosts do not
          # carry the key at all, so absence means "the only architecture".
          arch = {"ARM64": "arm64", "X64": "x64"}.get(os.environ["RUNNER_ARCH"])
          candidates = [
              release for release in manifest["releases"]
              if release["channel"] == channel
              and release.get("dart_sdk_arch", arch) == arch
          ]
          if wanted:
              candidates = [r for r in candidates if r["version"] == wanted]
          else:
              current = manifest["current_release"][channel]
              candidates = [r for r in candidates if r["hash"] == current]
          if len(candidates) != 1:
              raise SystemExit(
                  f"Flutter {channel}/{wanted or 'current'} on {host}/{arch} "
                  f"resolved to {len(candidates)} releases, expected exactly one")
          release = candidates[0]

          values = {
              "archive_url": f"{manifest['base_url']}/{release['archive']}",
              "archive_sha256": release["sha256"],
              "dart_version": release["dart_sdk_version"].split(" ")[0],
              "revision": release["hash"],
              "version": release["version"],
              # The cache key names every input that changes the bytes. The
              # revision is the release's own content identity, so a channel
              # that moves cannot silently reuse an older SDK.
              "arch": arch,
              "cache_key": f"flutter-{host}-{arch}-{channel}-{release['version']}-{release['hash']}",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          print(f"resolved Flutter {values['version']} ({channel}) on {host}/{arch}")
          PY

      - name: Restore the Flutter SDK
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: ${{ steps.release.outputs.cache_key }}

      - name: Install the Flutter SDK
        if: ${{ steps.sdk-cache.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          ARCHIVE_SHA256: ${{ steps.release.outputs.archive_sha256 }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/flutter-archive"
          # --retry covers the transient case only; a 404 or a digest mismatch
          # must fail rather than be retried into success.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-connrefused --max-time 900 \
            --output "$archive" "$ARCHIVE_URL"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" > "${RUNNER_TEMP}/flutter.sha256"
          shasum -a 256 -c "${RUNNER_TEMP}/flutter.sha256"
          rm -rf "${RUNNER_TEMP}/flutter-sdk"
          mkdir -p "${RUNNER_TEMP}/flutter-sdk"
          case "$ARCHIVE_URL" in
            *.tar.xz) tar -xJf "$archive" -C "${RUNNER_TEMP}/flutter-sdk" --strip-components=1 ;;
            *.zip)    unzip -q "$archive" -d "${RUNNER_TEMP}/flutter-unpack"
                      mv "${RUNNER_TEMP}/flutter-unpack/flutter" "${RUNNER_TEMP}/flutter-sdk-inner"
                      rm -rf "${RUNNER_TEMP}/flutter-sdk"
                      mv "${RUNNER_TEMP}/flutter-sdk-inner" "${RUNNER_TEMP}/flutter-sdk" ;;
            *) echo "unsupported Flutter archive format: $ARCHIVE_URL" >&2; exit 1 ;;
          esac
          rm -f "$archive"

      - name: Restore the pub cache
        id: pub-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: >-
            pub-${{ steps.release.outputs.cache_key }}-${{
            hashFiles(format('{0}/**/pubspec.lock', inputs.working_directory),
                      format('{0}/**/pubspec.yaml', inputs.working_directory)) }}

      - name: Put Flutter on PATH
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo "${RUNNER_TEMP}/flutter-sdk/bin"
            echo "${RUNNER_TEMP}/flutter-sdk/bin/cache/dart-sdk/bin"
          } >> "$GITHUB_PATH"
          # `flutter pub` writes here; the action used to own this directory, so
          # a consumer keeps the same caching behaviour it had before.
          echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
          # A repository owned by another uid makes Flutter refuse to run; the
          # SDK lives in the runner temp dir, which the job owns.
          "${RUNNER_TEMP}/flutter-sdk/bin/flutter" --version --machine

      - name: Resolve dependencies
        if: ${{ inputs.pub_get_command != '' }}
        env:
          PUB_GET_COMMAND: ${{ inputs.pub_get_command }}
        run: bash -euo pipefail -c "$PUB_GET_COMMAND"

      - name: Format check
        if: ${{ inputs.format_check }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: ${{ inputs.analyze }}
        run: flutter analyze

      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
          TEST_LOG: ${{ runner.temp }}/dart-flutter-tests.log
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee "$TEST_LOG"
          echo "Flutter ${FLUTTER_CHANNEL} format + analyze + tests passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Emit runtime evidence
        id: evidence
        env:
          CACHE_KEY: ${{ steps.release.outputs.cache_key }}
          CALLEE_PATH: ${{ job.workflow_file_path }}
          CALLEE_REPOSITORY: ${{ job.workflow_repository }}
          CALLEE_SHA: ${{ job.workflow_sha }}
          FLUTTER_ARCH: ${{ steps.release.outputs.arch }}
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
          FLUTTER_VERSION: ${{ steps.release.outputs.version }}
          PUB_CACHE_KEY: ${{ steps.pub-cache.outputs.cache-primary-key }}
          PUB_GET_COMMAND: ${{ inputs.pub_get_command }}
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_LOG: ${{ runner.temp }}/dart-flutter-tests.log
        run: |
          python3 -I <<'PY'
          import hashlib, json, os, pathlib, re, subprocess

          version = json.loads(subprocess.check_output(
              ["flutter", "--version", "--machine"], text=True))

          # Provenance of the workflow that is running, not of the caller's tree.
          # `github.*` inside a called reusable is bound to the CALLER, so hashing
          # `${github.workspace}/.github/workflows/dart-flutter-ci.yml` digests a
          # file that belongs to the caller. `job.workflow_*` is bound to the
          # callee and supplied by the runner, so the repository/sha/path triple
          # names these exact bytes and no caller can forge it.
          receipt = {
              "callee_path": os.environ["CALLEE_PATH"],
              "callee_repository": os.environ["CALLEE_REPOSITORY"],
              "callee_sha": os.environ["CALLEE_SHA"],
              "caller_repository": os.environ["GITHUB_REPOSITORY"],
              "caller_sha": os.environ["GITHUB_SHA"],
              "dart_version": version["dartSdkVersion"].split()[0],
              "flutter_arch": os.environ["FLUTTER_ARCH"],
              "flutter_channel": os.environ["FLUTTER_CHANNEL"],
              "flutter_revision": version["frameworkRevision"],
              "flutter_version": os.environ["FLUTTER_VERSION"],
              "kind": "flutter",
              "os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "schema_version": 1,
          }
          sections = ["toolchain"]
          if os.environ["CACHE_KEY"] and os.environ["PUB_CACHE_KEY"]:
              sections.append("cache")
              receipt["cache_key"] = os.environ["CACHE_KEY"]
              receipt["pub_cache_key"] = os.environ["PUB_CACHE_KEY"]

          # `pub_get_command` is documented "Empty to skip", so a caller that
          # skips resolution has no reason to own a `pubspec.lock` -- reading one
          # unconditionally turned a documented option into a crash.
          lock = pathlib.Path("pubspec.lock")
          if os.environ["PUB_GET_COMMAND"] and lock.is_file():
              sections.append("resolve")
              receipt["pub_get_command"] = os.environ["PUB_GET_COMMAND"]
              receipt["pubspec_lock_sha256"] = hashlib.sha256(lock.read_bytes()).hexdigest()

          log = pathlib.Path(os.environ["TEST_LOG"])
          if os.environ["TEST_COMMAND"] and log.is_file():
              counts = [int(value) for value in re.findall(
                  r"\+(\d+)", log.read_text(encoding="utf-8"))]
              sections.append("test")
              receipt["test_command"] = os.environ["TEST_COMMAND"]
              receipt["test_count"] = max(counts, default=0)
              receipt["test_log_sha256"] = hashlib.sha256(log.read_bytes()).hexdigest()

          receipt["sections"] = sorted(sections)
          encoded = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"evidence={encoded}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\nRuntime evidence: `{encoded}`\n")
          PY
