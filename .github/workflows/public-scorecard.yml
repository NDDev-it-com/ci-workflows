name: public-scorecard

# Reusable OSSF Scorecard for PUBLIC repositories.
# Publishes supply-chain posture results and uploads SARIF to code scanning.
# Caller should trigger on push to the default branch and on a weekly schedule.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
      publish_results:
        description: 'Publish results to the OpenSSF Scorecard API (public repos).'
        type: boolean
        default: true
      filter_rule_ids:
        description: 'Comma-separated Scorecard rule IDs to DROP from results (e.g. "MaintainedID,CodeReviewID,CIIBestPracticesID"). Empty = keep all.'
        type: string
        default: ''
      normalize_placeholder_uris:
        description: 'Replace "no file associated with this alert" artifact URIs with a URI-safe placeholder (avoids upload errors).'
        type: boolean
        default: false
      upload_sarif_on_forks:
        description: 'Upload SARIF to code scanning even on fork PRs. Default false (skip forks).'
        type: boolean
        default: false

permissions: {}

jobs:
  scorecard:
    name: OSSF Scorecard
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      - name: Normalize placeholder URIs
        if: ${{ inputs.normalize_placeholder_uris }}
        shell: bash
        run: |
          set -euo pipefail
          # Replace the non-URI-safe placeholder that Scorecard emits for
          # alerts not tied to a specific file, which causes upload errors.
          jq '(.runs[].results[].artifactLocation.uri // empty) |=
              (if . == "no file associated with this alert"
               then "no-file-associated-with-this-alert" else . end)' \
            results.sarif > results.filtered.sarif
          mv results.filtered.sarif results.sarif

      - name: Filter rule IDs
        if: ${{ inputs.filter_rule_ids != '' }}
        shell: bash
        env:
          FILTER_RULE_IDS: ${{ inputs.filter_rule_ids }}
        run: |
          set -euo pipefail
          # Build a jq "select" condition to drop results/rules by ruleId.
          IFS=',' read -ra IDS <<< "$FILTER_RULE_IDS"
          cond=""
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs)  # trim whitespace
            cond+="select(.ruleId != \"$id\") and "
          done
          cond="${cond% and }"
          # Filter results and drop orphaned rule definitions
          jq --argjson cond "$cond" '
            .runs[].results |= map(. | select($cond)) |
            .runs[].tool.driver.rules |= map(. | select(.id as $id | $cond))
          ' results.sarif > results.filtered.sarif
          mv results.filtered.sarif results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        if: ${{ github.event_name != 'pull_request' || inputs.upload_sarif_on_forks || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4.37.5
        with:
          sarif_file: results.sarif
