schema_version: 1

repository:
  id: "repo_01KX8PR6R8YJETP3PV4H7E608B"
  display_name: "ci-workflows"
  roles:
    - "project"
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 1289065451
  owner: "NDDev-it-com"
  name: "ci-workflows"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
    # Repository-tier override. The estate base policy is squash-only; this
    # repository takes merge commits, because consumers, ADRs, the
    # runtime-coverage ledger and release provenance all reference individual
    # commits. Without this the compiled projection declared
    # `allow_squash_merge: true` under `management: managed` against a live
    # repository that allows the merge method only.
    - "ci-workflows"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    lint:
      - "python3 -I -B scripts/check_python_syntax.py"
    test:
      - "python3 -I -B scripts/check_python_execution_contract.py --launch validate_all.py --"
  required:
    - "lint"
    - "test"
  # The status checks this repository's protected branch actually requires, as
  # opposed to the commands that prove it locally. A required context is a check
  # run name, not a command, and nothing derives one from the other -- so the
  # consuming control plane could otherwise read a weaker gate than a merge here
  # really enforces. `check_anchor_contexts.py` compares this list against the
  # live ruleset in the advisory sweep, so it cannot drift in either direction.
  required_contexts:
    - "ci-gate"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: false
    provenance_required: false

module:
  contract: "public"
  consumption:
    # Physically pinned as a gitlink by the control plane, and executed by
    # GitHub directly from this repository as a reusable workflow.
    - "git-submodule"
    - "runtime-service"
  compatibility: "semver"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "required"

release:
  mode: "github-release"
