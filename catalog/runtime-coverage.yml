# Runtime contract coverage for every published reusable workflow.
#
# Honest ledger, not an aspiration: a workflow is only 'runtime-proven'
# when a real observed workflow_call run exists (last_run set). Workflows
# with only some jobs executed are 'partial-runtime' and name those jobs;
# executable embedded-program/contract validators without a live workflow_call
# run are 'static-only'. Everything else is 'unverified' until a safe consumer
# fixture runs it. Every non-proven row carries typed
# risk, barrier, required capability and issue handoff. Waivers are restricted
# to objective external secrets, licensing or real-host barriers and add owner
# plus expiry. scripts/validate_runtime_coverage.py enforces completeness and
# evidence/debt discipline, and reports the honest status counts.
