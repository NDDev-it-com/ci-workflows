# Estate-neutral execution contract for every published reusable workflow.
# Operator labels never belong here: this file states what can run where and
# what the machine must provide. An operator mapping compiles those facts into
# labels before a caller is committed or dispatched.
schema: nddev-ci-workflow-routing/v1
platforms: [linux, macos, windows]
runtime_requirements: [container-runtime]
groups:
  - id: portable-shell
    supported_os: [linux, macos, windows]
    runtime_requirements: []
    workflows:
      - .github/workflows/cross-platform-smoke.yml
      - .github/workflows/dotnet-ci.yml
      - .github/workflows/go-ci.yml
      - .github/workflows/java-ci.yml
      - .github/workflows/node-ci.yml
      - .github/workflows/python-ci.yml
      - .github/workflows/rust-ci.yml
      - .github/workflows/sql-ci.yml
      - .github/workflows/terraform-ci.yml
      - .github/workflows/web-ci.yml
  - id: macos-shell
    supported_os: [macos]
    runtime_requirements: []
    workflows:
      - .github/workflows/swift-ci.yml
  - id: linux-container
    supported_os: [linux]
    runtime_requirements: [container-runtime]
    workflows:
      - .github/workflows/container-ci.yml
      - .github/workflows/secret-scan.yml
  - id: linux-shell
    supported_os: [linux]
    runtime_requirements: []
    workflows:
      - .github/workflows/actionlint.yml
      - .github/workflows/benchmark-compare.yml
      - .github/workflows/benchmark.yml
      - .github/workflows/clusterfuzzlite.yml
      - .github/workflows/coverage-gate.yml
      - .github/workflows/cpp-ci.yml
      - .github/workflows/dart-flutter-ci.yml
      - .github/workflows/docs-ci.yml
      - .github/workflows/docs-quality.yml
      - .github/workflows/fuzzing.yml
      - .github/workflows/gate.yml
      - .github/workflows/grype-scan.yml
      - .github/workflows/hadolint-ci.yml
      - .github/workflows/iac-scan.yml
      - .github/workflows/kotlin-android-ci.yml
      - .github/workflows/monorepo-changed-paths.yml
      - .github/workflows/mutation-testing.yml
      - .github/workflows/osv-scan.yml
      - .github/workflows/pr-hygiene.yml
      - .github/workflows/private-static.yml
      - .github/workflows/public-codeql.yml
      - .github/workflows/public-dependency-review.yml
      - .github/workflows/public-scorecard-json.yml
      - .github/workflows/public-scorecard.yml
      - .github/workflows/qt-ci.yml
      - .github/workflows/r-ci.yml
      - .github/workflows/release-promotion-gate.yml
      - .github/workflows/release-supply-chain-free.yml
      - .github/workflows/release-supply-chain.yml
      - .github/workflows/rust-supply-chain.yml
      - .github/workflows/semgrep-ci.yml
      - .github/workflows/zizmor-no-sarif.yml
      - .github/workflows/zizmor-sarif.yml
